[generation]
	#Minimum number of rooms in a generated prototype dungeon.
	# Default: 5
	# Range: 3 ~ 20
	minRooms = 5
	#Maximum number of rooms in a generated prototype dungeon.
	# Default: 8
	# Range: 3 ~ 20
	maxRooms = 8
	#Minimum room width/depth. Even values are adjusted to an odd value.
	# Default: 17
	# Range: 7 ~ 35
	minRoomSize = 17
	#Maximum room width/depth. Even values are adjusted to an odd value.
	# Default: 29
	# Range: 7 ~ 35
	maxRoomSize = 29
	#Minimum room interior height.
	# Default: 6
	# Range: 5 ~ 10
	minRoomHeight = 6
	#Maximum room interior height.
	# Default: 8
	# Range: 5 ~ 10
	maxRoomHeight = 8
	#Distance between logical room centers. Larger values create longer corridors.
	# Default: 38
	# Range: 38 ~ 56
	cellSpacing = 38
	#Corridor interior width. Even values are adjusted to an odd value.
	# Default: 3
	# Range: 3 ~ 5
	corridorWidth = 3
	#Chance to grow from a random frontier room instead of the newest room.
	# Default: 0.4
	# Range: 0.0 ~ 1.0
	branchChance = 0.4
	#Chance for an ordinary room to become a COMBAT room.
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	combatRoomChance = 1.0
	#Whether one dedicated LOOT room is assigned during dungeon generation.
	lootRoomEnabled = true
	#Legacy/default floor count. Portal UI selections can create up to 40 floors.
	# Default: 6
	# Range: 1 ~ 40
	floorCount = 6

[combat]
	#Base multiplier applied to the complete enemy party in a COMBAT encounter.
	# Default: 1
	# Range: 1 ~ 3
	enemyCount = 1

[multiplayer]
	#Maximum number of players allowed in one dungeon party.
	# Default: 8
	# Range: 1 ~ 8
	maxPartySize = 8
	#Players within this distance of the used DC Portal join its dungeon party.
	# Default: 8.0
	# Range: 1.0 ~ 32.0
	joinRadius = 8.0

[modifier]
	#Minimum number of positive modifiers offered by one Floor Choice.
	# Default: 1
	# Range: 1 ~ 3
	minPositiveCount = 1
	#Maximum number of positive modifiers offered by one Floor Choice.
	# Default: 3
	# Range: 1 ~ 3
	maxPositiveCount = 3
	#Minimum number of negative modifiers offered by one Floor Choice.
	# Default: 1
	# Range: 1 ~ 3
	minNegativeCount = 1
	#Maximum number of negative modifiers offered by one Floor Choice.
	# Default: 3
	# Range: 1 ~ 3
	maxNegativeCount = 3
	#Highest Tier increment available to generated Floor Choices.
	# Default: 3
	# Range: 1 ~ 3
	maxTier = 3
	#Maximum accumulated Tier for one active modifier.
	# Default: 5
	# Range: 1 ~ 5
	maxAccumulatedTier = 5

