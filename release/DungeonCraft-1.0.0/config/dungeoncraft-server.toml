[loot]
	#Chance for a NORMAL room to contain a chest. LOOT rooms always contain one; COMBAT rooms never do.
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	extraChestChance = 0.25
	#Chance for a generated chest to contain food.
	# Default: 0.8
	# Range: 0.0 ~ 1.0
	foodChance = 0.8
	#Minimum food item count.
	# Default: 2
	# Range: 1 ~ 64
	foodMin = 2
	#Maximum food item count.
	# Default: 6
	# Range: 1 ~ 64
	foodMax = 6
	#Chance for a generated chest to contain arrows.
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	arrowChance = 0.2
	#Minimum arrow count.
	# Default: 4
	# Range: 1 ~ 64
	arrowMin = 4
	#Maximum arrow count.
	# Default: 16
	# Range: 1 ~ 64
	arrowMax = 16
	#Chance for a generated chest to contain a material stack.
	# Default: 0.45
	# Range: 0.0 ~ 1.0
	materialChance = 0.45
	#Minimum material item count.
	# Default: 2
	# Range: 1 ~ 64
	materialMin = 2
	#Maximum material item count.
	# Default: 8
	# Range: 1 ~ 64
	materialMax = 8
	#Chance for a generated chest to contain one equipment item.
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	equipmentChance = 0.25
